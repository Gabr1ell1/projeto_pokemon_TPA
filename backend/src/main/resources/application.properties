# ================================
# Servidor
# ================================
# O README do app Login-main espera a API rodando na porta 8081
server.port=8082

# ================================
# MongoDB
# ================================
# Ajuste o nome do banco se quiser; ele e as collections sao criados
# automaticamente pelo Spring Data na primeira gravacao.
spring.data.mongodb.uri=mongodb://localhost:27017/login_app_db

# ================================
# Cookie de autentica\u00e7\u00e3o
# ================================
# false em dev local (HTTP) - o navegador/RN recusa cookie Secure sem HTTPS.
# Troque para true quando publicar no Render (l\u00e1 j\u00e1 \u00e9 HTTPS).
app.cookie.secure=false

# ================================
# JWT
# ================================
# Chave usada para assinar o token (HS256). Gerada com: openssl rand -base64 32
# Troque por uma sua antes de entregar/publicar o projeto.
jwt.secret=PemvX7cBhwP0ZoDz450B9wisDvTpuomRWkqx8Ss0yA8=
# 24 horas em milissegundos
jwt.expiration-ms=86400000

# ================================
# Logs (ajuda a depurar cadastro/login)
# ================================
logging.level.com.fatec.loginapi=DEBUG
logging.level.org.springframework.data.mongodb=INFO
